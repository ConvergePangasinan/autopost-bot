<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Facebook Preview</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f0f2f5; display: flex; justify-content: center; padding: 40px; }
    .card { background: white; border-radius: 8px; width: 400px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .button { background: #1877f2; color: white; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
    .message { margin-top: 15px; }
    img { width: 100%; border-radius: 6px; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <strong>My Page</strong>
      <button class="button" onclick="loadPost()">Next Random Post</button>
    </div>
    <p class="message">Loading...</p>
    <img id="postImage" src="" alt="" style="display:none;">
  </div>

  <script>
    async function loadPost() {
      const res = await fetch('/api/random-post');
      const data = await res.json();
      document.querySelector('.message').textContent = data.message || 'No message';
      const img = document.getElementById('postImage');
      if (data.imageUrl) {
        img.src = data.imageUrl;
        img.style.display = 'block';
      } else {
        img.style.display = 'none';
      }
    }
    loadPost();
  </script>
</body>
</html>
